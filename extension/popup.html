<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AuraSafe</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    width: 300px;
    background: #0d0d14;
    color: #e0e0e0;
    font-family: "Segoe UI", system-ui, sans-serif;
    font-size: 13px;
    padding: 0;
  }

  header {
    background: linear-gradient(135deg, #1a0a0a 0%, #0d0d14 100%);
    padding: 18px 20px 14px;
    border-bottom: 1px solid #2a1a1a;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  header .shield { font-size: 28px; }
  header h1 { font-size: 18px; font-weight: 800; color: #FF4444; letter-spacing: 1px; }
  header p  { font-size: 11px; color: #555; margin-top: 2px; }

  .status-bar {
    padding: 12px 20px;
    display: flex;
    align-items: center;
    gap: 10px;
    border-bottom: 1px solid #1a1a24;
  }

  .dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .dot.online  { background: #4CAF50; box-shadow: 0 0 6px #4CAF5088; }
  .dot.offline { background: #555; }
  .dot.blocked { background: #FF4444; box-shadow: 0 0 6px #FF444488; animation: pulse 1s infinite; }

  @keyframes pulse {
    0%,100% { opacity: 1; }
    50%      { opacity: 0.5; }
  }

  #status-text { color: #aaa; font-size: 12px; }

  .section { padding: 14px 20px; border-bottom: 1px solid #1a1a24; }
  .section h2 { font-size: 11px; font-weight: 700; color: #444; text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 10px; }

  .stat-row {
    display: flex; justify-content: space-between;
    align-items: center; margin-bottom: 6px;
  }
  .stat-label { color: #888; }
  .stat-value { color: #ccc; font-weight: 600; }
  .stat-value.red { color: #FF4444; }
  .stat-value.green { color: #4CAF50; }

  .actions { padding: 14px 20px; display: flex; flex-direction: column; gap: 8px; }

  button {
    width: 100%;
    padding: 9px 16px;
    border: none;
    border-radius: 6px;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    letter-spacing: 0.5px;
    transition: opacity 0.15s;
  }
  button:hover { opacity: 0.85; }
  button:disabled { opacity: 0.35; cursor: not-allowed; }

  .btn-block   { background: #FF4444; color: #fff; }
  .btn-unblock { background: #4CAF50; color: #fff; }
  .btn-rescan  { background: #1e2030; color: #88a; border: 1px solid #2a2a44; }

  .last-event {
    padding: 10px 20px 14px;
    font-size: 11px;
    color: #444;
    word-break: break-all;
  }
  .last-event span { color: #666; }
</style>
</head>
<body>

<header>
  <div class="shield">🛡️</div>
  <div>
    <h1>AURASAFE</h1>
    <p>Local Safety Engine v2.0</p>
  </div>
</header>

<div class="status-bar">
  <div class="dot" id="status-dot"></div>
  <span id="status-text">Checking backend…</span>
</div>

<div class="section">
  <h2>Engine State</h2>
  <div class="stat-row">
    <span class="stat-label">Backend</span>
    <span class="stat-value" id="val-backend">—</span>
  </div>
  <div class="stat-row">
    <span class="stat-label">Block State</span>
    <span class="stat-value" id="val-blocked">—</span>
  </div>
  <div class="stat-row">
    <span class="stat-label">Focus Lock</span>
    <span class="stat-value" id="val-locked">—</span>
  </div>
</div>

<div class="actions">
  <button class="btn-block"   id="btn-block">⛔ Force Block</button>
  <button class="btn-unblock" id="btn-unblock">✅ Unblock</button>
  <button class="btn-rescan"  id="btn-rescan">🔍 Rescan Tab</button>
</div>

<div class="last-event">Last event: <span id="last-event">—</span></div>

<script>
  const dot       = document.getElementById("status-dot");
  const statusTxt = document.getElementById("status-text");
  const valBe     = document.getElementById("val-backend");
  const valBlocked= document.getElementById("val-blocked");
  const valLocked = document.getElementById("val-locked");
  const lastEvent = document.getElementById("last-event");

  function refresh() {
    chrome.runtime.sendMessage({ type: "GET_STATUS" }, (s) => {
      if (!s || !s.online) {
        dot.className = "dot offline";
        statusTxt.textContent = "Backend offline";
        valBe.textContent = "Offline"; valBe.className = "stat-value red";
        valBlocked.textContent = "—";
        valLocked.textContent  = "—";
        return;
      }

      if (s.blocked) {
        dot.className = "dot blocked";
        statusTxt.textContent = "BLOCKED";
      } else {
        dot.className = "dot online";
        statusTxt.textContent = "Active — All Clear";
      }

      valBe.textContent = "Online"; valBe.className = "stat-value green";

      valBlocked.textContent = s.blocked ? "BLOCKED" : "Clear";
      valBlocked.className   = "stat-value " + (s.blocked ? "red" : "green");

      valLocked.textContent  = s.locked ? "LOCKED" : "Off";
      valLocked.className    = "stat-value " + (s.locked ? "red" : "");

      lastEvent.textContent = s.last_event || "none";
    });
  }

  refresh();
  setInterval(refresh, 2000);

  document.getElementById("btn-block").addEventListener("click", () => {
    chrome.runtime.sendMessage({ type: "MANUAL_BLOCK" }, refresh);
  });
  document.getElementById("btn-unblock").addEventListener("click", () => {
    chrome.runtime.sendMessage({ type: "MANUAL_UNBLOCK" }, refresh);
  });
  document.getElementById("btn-rescan").addEventListener("click", () => {
    chrome.runtime.sendMessage({ type: "RESCAN_TAB" });
  });
</script>
</body>
</html>
